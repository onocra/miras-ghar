
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>MIRĀS GHĀR | The Heritage House</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3ead8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
    }

    .heritage-cover {
      position: relative;
      width: min(100%, 1672px);
      aspect-ratio: 1672 / 941;
    }

    .heritage-cover img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Clickable entrance, aligned to the door artwork */
    .heritage-door {
      position: absolute;
      inset: 0;
      clip-path: polygon(
        61% 23%, 64% 16%, 70.4% 12%,
        77.5% 16%, 81.5% 23%,
        81.5% 77%, 61% 77%
      );
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .heritage-door:hover,
    .heritage-door:focus-visible {
      background: rgba(240, 200, 110, 0.14);
    }

    .mobile-enter {
      display: none;
    }

    @media (max-width: 700px) {
      body {
        flex-direction: column;
      }

      .mobile-enter {
        display: block;
        margin-top: 15px;
        padding: 12px 18px;
        color: #36503b;
        border: 1px solid #b69a65;
        text-decoration: none;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="heritage-cover">

      <img
        src="/assets/miras-ghar-heritage-entrance.png"
        alt="MIRĀS GHĀR — The Heritage House"
      >

      <a
        class="heritage-door"
        href="/bp/"
        aria-label="Enter The Heritage House"
      ></a>

    </div>

    <a class="mobile-enter" href="/bp/">
      ENTER THE HERITAGE HOUSE
    </a>
  </main>

</body>
</html>
