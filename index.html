
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MIRĀS GHĀR | The Heritage House</title>

<meta name="description"
 content="MIRĀS GHĀR — The Heritage House.
 A heritage of trust. A legacy of preservation.">

<style>

:root {
  --ivory: #f5eedf;
  --forest: #35432c;
  --gold: #b49455;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(
      ellipse at center,
      #fffaf1,
      var(--ivory)
    );
  font-family: Georgia, "Times New Roman", serif;
}

/* MAIN LANDSCAPE COVER */

.welcome {
  width: min(100%, 1672px);
  margin: auto;
  text-align: center;
}

.cover {
  width: 100%;
  aspect-ratio: 1672 / 941;
  position: relative;
}

/* APPROVED 3D ARTWORK */

.cover-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* CLICKABLE DOORWAY AREA */

.enter-door {

  position: absolute;

  left: 8%;
  top: 0.6%;
  width: 35.5%;
  height: 98%;

  clip-path: polygon(
    50% 0%,
    61% 5%,
    80% 18%,
    94% 30%,
    97% 42%,
    97% 100%,
    0% 100%,
    0% 42%,
    4% 30%,
    18% 18%,
    39% 5%
  );

  display: block;
  text-decoration: none;
  cursor: pointer;
  outline-offset: 4px;

}

/* GOLDEN LIGHT ON HOVER */

.enter-door::before {

  content: "";
  position: absolute;
  inset: 0;

  background: rgba(255, 211, 125, 0);

  transition: background 0.35s ease;

}

.enter-door:hover::before,
.enter-door:focus-visible::before {

  background: rgba(255, 211, 125, 0.11);

}

/* VISIBLE ENTER ICON */

.enter-icon {

  position: absolute;

  left: 64%;
  top: 60%;

  transform: translate(-50%, -50%);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 5px;

  padding: 10px 15px;

  min-width: 78px;

  background: rgba(255, 246, 225, 0.95);

  border: 1px solid var(--gold);
  border-radius: 35px;

  color: var(--forest);

  box-shadow:
    0 4px 16px rgba(87, 60, 24, 0.25);

  transition:
    transform 0.3s ease,
    background 0.3s ease,
    box-shadow 0.3s ease;

}

.enter-icon svg {

  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;

  stroke-linecap: round;
  stroke-linejoin: round;

}

.enter-icon span {

  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;

}

/* HOVER EFFECT */

.enter-door:hover .enter-icon,
.enter-door:focus-visible .enter-icon {

  transform:
    translate(-50%, -50%) scale(1.12);

  background: #fff0c8;

  box-shadow:
    0 6px 24px rgba(154, 105, 35, 0.38);

}

/* MOBILE ACCESSIBLE ENTER BUTTON */

.mobile-enter {

  display: none;

  margin: 14px auto 25px;
  padding: 13px 22px;

  width: max-content;

  background: var(--forest);
  color: #fff8ea;

  border: 1px solid var(--gold);
  border-radius: 30px;

  text-decoration: none;

  letter-spacing: 1px;
  font-size: 12px;

}

.mobile-enter:hover {
  background: #526a50;
}

/* MOBILE */

@media (max-width: 700px) {

  .enter-icon {
    padding: 5px;
    min-width: 38px;
    gap: 2px;
  }

  .enter-icon svg {
    width: 15px;
    height: 15px;
  }

  .enter-icon span {
    font-size: 7px;
    letter-spacing: 0.5px;
  }

  .mobile-enter {
    display: block;
  }

}

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    transition: none !important;
  }

}

</style>

</head>

<body>

<main class="welcome">

  <div class="cover">

    <!-- OFFICIAL APPROVED 3D COVER -->

    <img
      class="cover-image"
      src="./assets/miras-ghar-entrance-3d.png"
      alt="MIRĀS GHĀR — The Heritage House"
    >

    <!-- CLICKABLE DOOR: OPENS BP HOMEPAGE -->

    <a
      class="enter-door"
      href="./bp/index.html"
      aria-label="Enter MIRĀS GHĀR — The Heritage House"
    >

      <!-- GOLD ENTER ICON -->

      <span class="enter-icon" aria-hidden="true">

        <svg viewBox="0 0 24 24">
          <path d="M4 12h15"/>
          <path d="m13 6 6 6-6 6"/>
        </svg>

        <span>ENTER</span>

      </span>

    </a>

  </div>

  <!-- MOBILE ENTER BUTTON -->

  <a
    class="mobile-enter"
    href="./bp/index.html"
  >
    ENTER THE HERITAGE HOUSE →
  </a>

</main>

</body>
</html>
