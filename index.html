
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MIRĀS GHĀR | The Heritage House</title>

  <meta name="description"
    content="MIRĀS GHĀR — The Heritage House. A heritage of trust, a legacy of preservation.">

  <style>
    :root {
      --forest: #35432c;
      --gold: #b49455;
      --paper: #f5eedf;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    .welcome {
      width: min(100%, 1672px);
      margin: auto;
    }

    .artwork {
      position: relative;
      width: 100%;
      aspect-ratio: 1672 / 941;
    }

    .artwork > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* CLICKABLE DOOR */

    .entrance {
      position: absolute;

      left: 8%;
      top: 0.6%;
      width: 35.5%;
      height: 98%;

      clip-path: polygon(
        50% 0%,
        61% 5%,
        80% 18%,
        94% 30%,
        97% 42%,
        97% 100%,
        0% 100%,
        0% 42%,
        4% 30%,
        18% 18%,
        39% 5%
      );

      display: block;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .entrance::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(249, 213, 129, 0);
      transition: background 0.25s ease;
    }

    .entrance:hover::before,
    .entrance:focus-visible::before {
      background: rgba(249, 213, 129, 0.10);
    }

    /* GOLD ENTER ICON */

    .enter-cue {
      position: absolute;

      left: 64%;
      top: 60%;

      transform: translate(-50%, -50%);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 5px;
      padding: 10px 14px;
      min-width: 74px;

      border: 1px solid var(--gold);
      border-radius: 50px;

      color: var(--forest);
      background: rgba(250, 240, 215, 0.9);

      box-shadow:
        0 3px 15px rgba(68, 49, 15, 0.17),
        inset 0 0 0 2px rgba(255, 255, 255, 0.52);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .enter-cue svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .enter-cue span {
      font-size: 11px;
      letter-spacing: 0.15em;
      font-weight: bold;
    }

    .entrance:hover .enter-cue,
    .entrance:focus-visible .enter-cue {
      transform: translate(-50%, -50%) scale(1.09);
      background: #fff1cc;
      box-shadow: 0 4px 24px rgba(91, 62, 23, 0.30);
    }

    /* MOBILE ENTER BUTTON */

    .mobile-enter {
      display: none;

      margin: 0 auto 20px;
      width: max-content;
      padding: 12px 22px;

      border: 1px solid var(--gold);
      border-radius: 100px;

      color: var(--forest);
      text-decoration: none;

      letter-spacing: 0.10em;
      font-size: 12px;
    }

    @media (max-width: 700px) {

      .enter-cue {
        padding: 5px 7px;
        min-width: 36px;
        gap: 1px;
      }

      .enter-cue svg {
        width: 14px;
        height: 14px;
      }

      .enter-cue span {
        font-size: 7px;
      }

      .mobile-enter {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before {
        transition: none !important;
      }
    }

  </style>
</head>

<body>

  <main class="welcome">

    <div class="artwork">

      <!-- APPROVED 3D COVER IMAGE -->

      <img
        src="assets/miras-ghar-entrance-3d.png"
        alt="MIRĀS GHĀR — The Heritage House"
      >

      <!-- CLICKABLE DOORWAY -->

      <a
        class="entrance"
        href="/bp/"
        aria-label="Enter MIRĀS GHĀR — The Heritage House"
      >

        <span class="enter-cue" aria-hidden="true">

          <svg viewBox="0 0 24 24">
            <path d="M4 12h15m-6-6 6 6-6 6"/>
          </svg>

          <span>ENTER</span>

        </span>

      </a>

    </div>

    <!-- MOBILE ENTRANCE -->

    <a class="mobile-enter" href="/bp/">
      ENTER THE HERITAGE HOUSE →
    </a>

  </main>

</body>
</html>
